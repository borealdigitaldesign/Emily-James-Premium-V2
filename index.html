<style>

/* =========================================================

   GENERAL

========================================================= */

* {

  box-sizing: border-box;

}

html {

  scroll-behavior: smooth;

}

body {

  margin: 0;

  padding: 0;

  background: #f7f3ef;

  font-family: Georgia, "Times New Roman", serif;

  overflow-x: hidden;

}

/* =========================================================

   ENVELOPE INTRO

========================================================= */

#envelopeIntro {

  position: fixed;

  inset: 0;

  z-index: 10000;

  display: flex;

  justify-content: center;

  align-items: center;

  background: #f4e8df;

  transition:

    opacity 1s ease,

    visibility 1s ease;

}

/* =========================================================

   ENVELOPE STAGE

========================================================= */

.envelope-stage {

  position: relative;

  width: min(100vw, 70.64vh);

  aspect-ratio: 1054 / 1492;

  /*

    IMPORTANTE:

    Antes estaba overflow:hidden.

    Lo quitamos para que la solapa pueda

    girar sin quedar recortada.

  */

  overflow: visible;

  perspective: 1000px;

}

/* =========================================================

   ENVELOPE BASE

========================================================= */

.envelope-base {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: contain;

  z-index: 1;

}

/* =========================================================

   INVITATION CARD

========================================================= */

.envelope-card {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: contain;

  z-index: 2;

}

/* =========================================================

   ENVELOPE BODY

========================================================= */

.envelope-body {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: contain;

  z-index: 3;

}

/* =========================================================

   ENVELOPE FLAP

========================================================= */

.envelope-flap {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: contain;

  z-index: 5;

  transform-origin: 50% 28.2%;

  transform: rotateX(0deg);

  transition:

    transform 1.2s

    cubic-bezier(.4, 0, .2, 1);

  backface-visibility: visible;

  -webkit-backface-visibility: visible;

}

/* =========================================================

   WAX SEAL

========================================================= */

.envelope-seal {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: contain;

  z-index: 10;

  cursor: pointer;

  transition:

    opacity .5s ease,

    transform .6s ease;

  animation:

    sealPulse 2.2s

    ease-in-out

    infinite;

}

/* =========================================================

   SEAL PULSE

========================================================= */

@keyframes sealPulse {

  0%,

  100% {

    transform: scale(1);

  }

  50% {

    transform: scale(1.025);

  }

}

/* =========================================================

   OPENING ANIMATION

========================================================= */

#envelopeIntro.opening .envelope-flap {

  transform:

    rotateX(180deg);

}

/*

   IMPORTANTE:

   Después de abrirse, mantenemos la solapa

   por detrás de la invitación pero visible.

*/

#envelopeIntro.opening .envelope-seal {

  opacity: 0;

  transform:

    scale(1.18);

  pointer-events: none;

  animation: none;

}

/* =========================================================

   HIDE ENVELOPE

========================================================= */

#envelopeIntro.hide {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}

/* =========================================================

   MAIN INVITATION

========================================================= */

}

.page {

.our-day-countdown-number {

      href="https://maps.app.goo.gl/dV8X18uiQC9rwmor6?g_st=ic"

      target="_blank"

      rel="noopener">

      VIEW HOTEL

    </a>

    <!-- FOUR SEASONS -->

    <a

      class="hotel-button hotel-four-seasons"

      href="https://maps.app.goo.gl/bZVu7zGhxoazHQs76?g_st=ic"

      target="_blank"

      rel="noopener">

      VIEW HOTEL

    </a>

    <!-- BACK -->

    <a

      href="#details-section"

      class="back-button accommodations-back back-to-details">

      BACK TO INVITATION

    </a>

  </div>

</section>

<!-- =========================================================

     MUSIC

========================================================= -->

<audio

  id="weddingMusic"

  loop

  preload="auto">

  <source

    src="musica.mp3"

    type="audio/mpeg">

</audio>

<button

  id="musicButton"

  type="button"

  aria-label="Play music">

  🎵

</button>

<script>

/* =========================================================

   ENVELOPE

========================================================= */

const envelopeIntro =

  document.getElementById(

    "envelopeIntro"

  );

const envelopeSeal =

  document.getElementById(

    "envelopeSeal"

  );

const mainInvitation =

  document.getElementById(

    "mainInvitation"

  );

function openEnvelope() {

  envelopeIntro.classList.add(

    "opening"

  );

  startMusic();

  setTimeout(

    function() {

      mainInvitation.style.display =

        "block";

      envelopeIntro.classList.add(

        "hide"

      );

      window.scrollTo({

        top: 0,

        behavior: "instant"

      });

    },

    1400

  );

}

envelopeSeal.addEventListener(

  "click",

  openEnvelope

);

/* =========================================================

   COUNTDOWN

========================================================= */

const weddingDate =

  new Date(

    "2026-11-28T00:00:00-06:00"

  ).getTime();

function updateCountdown() {

  const now =

    Date.now();

  const difference =

    weddingDate - now;

  if (difference <= 0) {

    document.getElementById(

      "days"

    ).textContent = "0";

    document.getElementById(

      "hours"

    ).textContent = "0";

    document.getElementById(

      "minutes"

    ).textContent = "0";

    document.getElementById(

      "seconds"

    ).textContent = "0";

    return;

  }

  const days =

    Math.floor(

      difference /

      (

        1000 *

        60 *

        60 *

        24

      )

    );

  const hours =

    Math.floor(

      (

        difference %

        (

          1000 *

          60 *

          60 *

          24

        )

      ) /

      (

        1000 *

        60 *

        60

      )

    );

  const minutes =

    Math.floor(

      (

        difference %

        (

          1000 *

          60 *

          60

        )

      ) /

      (

        1000 *

        60

      )

    );

  const seconds =

    Math.floor(

      (

        difference %

        (

          1000 *

          60

        )

      ) /

      1000

    );

  document.getElementById(

    "days"

  ).textContent =

    days;

  document.getElementById(

    "hours"

  ).textContent =

    hours;

  document.getElementById(

    "minutes"

  ).textContent =

    minutes;

  document.getElementById(

    "seconds"

  ).textContent =

    seconds;

}

updateCountdown();

setInterval(

  updateCountdown,

  1000

);

/* =========================================================

   SPECIAL PAGES

========================================================= */

const specialPages =

  document.querySelectorAll(

    ".special-page"

  );

function showMainInvitation() {

  mainInvitation.style.display =

    "block";

  specialPages.forEach(

    function(page) {

      page.classList.remove(

        "active"

      );

    }

  );

}

function showSpecialPage(

  pageId

) {

  mainInvitation.style.display =

    "none";

  specialPages.forEach(

    function(page) {

      page.classList.remove(

        "active"

      );

    }

  );

  const selectedPage =

    document.getElementById(

      pageId

    );

  if (selectedPage) {

    selectedPage.classList.add(

      "active"

    );

    window.scrollTo({

      top: 0,

      behavior: "smooth"

    });

  }

}

/* =========================================================

   OPEN SPECIAL PAGE

========================================================= */

document

  .querySelectorAll(

    ".special-link"

  )

  .forEach(

    function(link) {

      link.addEventListener(

        "click",

        function(event) {

          event.preventDefault();

          const pageId =

            this.getAttribute(

              "data-page"

            );

          history.pushState(

            null,

            "",

            "#" + pageId

          );

          showSpecialPage(

            pageId

          );

        }

      );

    }

  );

/* =========================================================

   BACK TO DETAILS

========================================================= */

document

  .querySelectorAll(

    ".back-to-details"

  )

  .forEach(

    function(link) {

      link.addEventListener(

        "click",

        function(event) {

          event.preventDefault();

          mainInvitation.style.display =

            "block";

          specialPages.forEach(

            function(page) {

              page.classList.remove(

                "active"

              );

            }

          );

          history.pushState(

            null,

            "",

            "#details-section"

          );

          setTimeout(

            function() {

              const details =

                document.getElementById(

                  "details-section"

                );

              if (details) {

                details.scrollIntoView({

                  behavior: "smooth",

                  block: "start"

                });

              }

            },

            50

          );

        }

      );

    }

  );

/* =========================================================

   LOAD PAGE FROM HASH

========================================================= */

function loadPageFromHash() {

  const hash =

    window.location.hash

      .replace(

        "#",

        ""

      );

  if (

    hash === "event-schedule" ||

    hash === "dress-code" ||

    hash === "accommodations"

  ) {

    envelopeIntro.classList.add(

      "hide"

    );

    mainInvitation.style.display =

      "none";

    showSpecialPage(

      hash

    );

  } else if (

    hash === "details-section"

  ) {

    envelopeIntro.classList.add(

      "hide"

    );

    mainInvitation.style.display =

      "block";

    specialPages.forEach(

      function(page) {

        page.classList.remove(

          "active"

        );

      }

    );

    setTimeout(

      function() {

        const details =

          document.getElementById(

            "details-section"

          );

        if (details) {

          details.scrollIntoView({

            behavior: "smooth",

            block: "start"

          });

        }

      },

      50

    );

  }

}

window.addEventListener(

  "popstate",

  loadPageFromHash

);

window.addEventListener(

  "hashchange",

  loadPageFromHash

);

if (

  window.location.hash

) {

  loadPageFromHash();

}

/* =========================================================

   MUSIC PLAYER

========================================================= */

const music =

  document.getElementById(

    "weddingMusic"

  );

const musicButton =

  document.getElementById(

    "musicButton"

  );

let musicPlaying =

  false;

function updateMusicButton() {

  if (musicPlaying) {

    musicButton.textContent =

      "⏸";

    musicButton.setAttribute(

      "aria-label",

      "Pause music"

    );

  } else {

    musicButton.textContent =

      "🎵";

    musicButton.setAttribute(

      "aria-label",

      "Play music"

    );

  }

}

function startMusic() {

  music.play()

    .then(

      function() {

        musicPlaying =

          true;

        updateMusicButton();

      }

    )

    .catch(

      function() {

        musicPlaying =

          false;

        updateMusicButton();

      }

    );

}

musicButton.addEventListener(

  "click",

  function() {

    if (

      music.paused

    ) {

      startMusic();

    } else {

      music.pause();

      musicPlaying =

        false;

      updateMusicButton();

    }

  }

);

updateMusicButton();

</script>

</body>

</html>
