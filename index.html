<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily & James | Wedding Invitation</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f5eee8;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.invitation {
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
    position: relative;
}

.page {
    position: relative;
    width: 100%;
}

.page img {
    display: block;
    width: 100%;
    height: auto;
}

/* =========================
   INTERACTIVE BUTTONS
========================= */

.hotspot {
    position: absolute;
    display: block;
    cursor: pointer;
    z-index: 20;
    background: transparent;
    border: none;
}

/* The Details buttons */

.details-schedule {
    top: 16%;
    left: 28%;
    width: 18%;
    height: 9%;
}

.details-dress {
    top: 16%;
    left: 48%;
    width: 18%;
    height: 9%;
}

.details-hotel {
    top: 16%;
    left: 68%;
    width: 18%;
    height: 9%;
}

/* Gift Registry */

.registry-button {
    top: 72%;
    left: 37%;
    width: 38%;
    height: 7%;
}

/* RSVP */

.rsvp-button {
    top: 87%;
    left: 39%;
    width: 34%;
    height: 7%;
}

/* Map */

.map-button {
    top: 79%;
    left: 38%;
    width: 25%;
    height: 9%;
}

/* Back buttons */

.back-button {
    bottom: 3%;
    left: 25%;
    width: 50%;
    height: 7%;
}

/* =========================
   COUNTDOWN
========================= */

.countdown {
    position: absolute;
    top: 36%;
    left: 8%;
    width: 84%;
    display: flex;
    justify-content: center;
    gap: 7%;
    text-align: center;
    z-index: 10;
    pointer-events: none;
}

.countdown-item {
    min-width: 16%;
}

.countdown-number {
    font-size: clamp(25px, 6vw, 48px);
    color: #704128;
    font-weight: 400;
}

.countdown-label {
    font-size: clamp(9px, 2vw, 14px);
    letter-spacing: 1px;
    color: #704128;
    margin-top: 3px;
}

/* =========================
   MUSIC BUTTON
========================= */

.music-button {
    position: fixed;
    right: 18px;
    bottom: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: rgba(173, 124, 116, 0.92);
    color: white;
    font-size: 22px;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.music-button:hover {
    transform: scale(1.05);
}

/* =========================
   MUSIC MESSAGE
========================= */

.music-message {
    position: fixed;
    right: 18px;
    bottom: 82px;
    background: rgba(112, 65, 40, 0.92);
    color: white;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 12px;
    z-index: 9998;
    display: none;
}

/* =========================
   TALLY RSVP
========================= */

.rsvp-frame {
    position: absolute;
    top: 20%;
    left: 18%;
    width: 64%;
    height: 38%;
    z-index: 15;
    border: none;
    border-radius: 20px;
    background: transparent;
}

/* Hide frame until Tally URL is added */
.rsvp-frame.hidden {
    display: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .music-button {
        width: 48px;
        height: 48px;
        right: 14px;
        bottom: 14px;
    }

    .music-message {
        right: 14px;
        bottom: 72px;
    }
}
</style>
</head>

<body>

<div class="invitation">

    <!-- =========================
         COVER
    ========================== -->

    <section class="page" id="invitation">
        <img src="portada.PNG" alt="Emily & James Wedding Invitation">
    </section>


    <!-- =========================
         OUR STORY
    ========================== -->

    <section class="page">
        <img src="our-story.PNG" alt="Our Story">
    </section>


    <!-- =========================
         OUR DAY
    ========================== -->

    <section class="page">

        <img src="our-day.PNG" alt="Our Day">

        <!-- LIVE COUNTDOWN -->
        <div class="countdown">

            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">DAYS</div>
            </div>

            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">HOURS</div>
            </div>

            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">MINUTES</div>
            </div>

            <div class="countdown-item">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">SECONDS</div>
            </div>

        </div>

        <!-- MAP BUTTON -->
        <a
            class="hotspot map-button"
            href="https://www.google.com/maps/search/?api=1&query=The+Garden+Valley+1234+Flower+Way+Nashville+TN+37201"
            target="_blank"
            aria-label="View Map">
        </a>

    </section>


    <!-- =========================
         THE DETAILS
    ========================== -->

    <section class="page" id="details">

        <img src="the-details.PNG" alt="Wedding Details">

        <!-- EVENT SCHEDULE -->
        <a
            class="hotspot details-schedule"
            href="#event-schedule"
            aria-label="Event Schedule">
        </a>

        <!-- DRESS CODE -->
        <a
            class="hotspot details-dress"
            href="#dress-code"
            aria-label="Dress Code">
        </a>

        <!-- ACCOMMODATIONS -->
        <a
            class="hotspot details-hotel"
            href="#accommodations"
            aria-label="Accommodations">
        </a>

        <!-- GIFT REGISTRY -->
        <a
            class="hotspot registry-button"
            href="https://example.com"
            target="_blank"
            aria-label="View Registry">
        </a>

        <!-- RSVP -->
        <a
            class="hotspot rsvp-button"
            href="#online-rsvp"
            aria-label="Online RSVP">
        </a>

    </section>


    <!-- =========================
         ONLINE RSVP
    ========================== -->

    <section class="page" id="online-rsvp">

        <img src="online-rsvp.PNG" alt="Online RSVP">

        <!--
        TALLY FORM WILL GO HERE.
        WE WILL ADD THE REAL TALLY URL AFTER YOU GIVE IT TO ME.
        -->

    </section>


    <!-- =========================
         GALLERY
    ========================== -->

    <section class="page">
        <img src="gallery.PNG" alt="Wedding Gallery">
    </section>


    <!-- =========================
         EVENT SCHEDULE
    ========================== -->

    <section class="page" id="event-schedule">

        <img src="event-schedule.PNG" alt="Event Schedule">

        <a
            class="hotspot back-button"
            href="#details"
            aria-label="Back to Invitation">
        </a>

    </section>


    <!-- =========================
         DRESS CODE
    ========================== -->

    <section class="page" id="dress-code">

        <img src="dress-code.PNG" alt="Dress Code">

        <a
            class="hotspot back-button"
            href="#details"
            aria-label="Back to Invitation">
        </a>

    </section>


    <!-- =========================
         ACCOMMODATIONS
    ========================== -->

    <section class="page" id="accommodations">

        <img src="accommodations.PNG" alt="Accommodations">

        <a
            class="hotspot back-button"
            href="#details"
            aria-label="Back to Invitation">
        </a>

    </section>


    <!-- =========================
         END
    ========================== -->

    <section class="page">
        <img src="end.PNG" alt="Thank You">
    </section>

</div>


<!-- =========================
     MUSIC
========================== -->

<audio id="weddingMusic" loop preload="auto">
    <!--
    WE WILL ADD THE MUSIC FILE HERE.
    Example:
    <source src="wedding-song.mp3" type="audio/mpeg">
    -->
</audio>

<button
    id="musicButton"
    class="music-button"
    aria-label="Pause or play music">
    ♪
</button>

<div id="musicMessage" class="music-message">
    Tap ♪ to play music
</div>


<script>

/* =========================
   COUNTDOWN
========================= */

const weddingDate = new Date("November 28, 2026 16:00:00").getTime();

function updateCountdown() {

    const now = new Date().getTime();
    const distance = weddingDate - now;

    if (distance <= 0) {

        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60))
        / 1000
    );

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCountdown();

setInterval(updateCountdown, 1000);


/* =========================
   MUSIC
========================= */

const music = document.getElementById("weddingMusic");
const musicButton = document.getElementById("musicButton");
const musicMessage = document.getElementById("musicMessage");

let musicStarted = false;


/*
Browsers may block automatic audio playback
until the visitor interacts with the page.
*/

window.addEventListener("load", () => {

    music.play()
        .then(() => {

            musicStarted = true;
            musicButton.textContent = "Ⅱ";

        })
        .catch(() => {

            musicMessage.style.display = "block";

            setTimeout(() => {
                musicMessage.style.display = "none";
            }, 5000);

        });

});


musicButton.addEventListener("click", () => {

    if (music.paused) {

        music.play();

        musicButton.textContent = "Ⅱ";

    } else {

        music.pause();

        musicButton.textContent = "♪";

    }

});

</script>

</body>
</html>
