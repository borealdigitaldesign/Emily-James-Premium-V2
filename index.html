<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emily & James | Wedding Invitation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f3ef;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    .invitation {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      position: relative;
    }

    .page {
      width: 100%;
      display: block;
      position: relative;
    }

    .page img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       MUSIC BUTTON
       ========================= */

    #musicButton {
      position: fixed;
      right: 18px;
      bottom: 22px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(126, 85, 73, 0.35);
      background: rgba(255, 250, 247, 0.92);
      color: #805b55;
      font-size: 21px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    #musicButton:active {
      transform: scale(0.95);
    }


    /* =========================
       OUR DAY SECTION
       ========================= */

    .our-day-section {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .our-day-section > img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       OUR DAY BUTTONS
       ========================= */

    .our-day-button {
      position: absolute;
      z-index: 999;
      width: 120px;
      padding: 8px 6px;
      border: 1px solid #a98270;
      border-radius: 25px;
      background: rgba(255,255,255,0.90);
      color: #805b55;
      text-decoration: none;
      text-align: center;
      font-size: 9px;
      letter-spacing: 1px;
      line-height: 1.2;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .our-day-button:hover {
      background: #fff;
    }


    /* =========================
       OUR DAY COUNTDOWN
       ========================= */

    .our-day-countdown {
      position: absolute;
      z-index: 999;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      text-align: center;
    }

    .our-day-countdown-title {
      margin: 0 0 10px;
      color: #805b55;
      font-size: 14px;
      letter-spacing: 1.5px;
    }

    .our-day-countdown-boxes {
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: nowrap;
    }

    .our-day-countdown-box {
      min-width: 48px;
      padding: 6px 5px;
      background: rgba(255,255,255,0.82);
      border: 1px solid #c7a28c;
      border-radius: 7px;
    }

    .our-day-countdown-number {
      display: block;
      font-size: 17px;
      color: #805b55;
      font-weight: bold;
    }

    .our-day-countdown-label {
      display: block;
      margin-top: 2px;
      font-size: 7px;
      letter-spacing: 0.7px;
      color: #6f625d;
      text-transform: uppercase;
    }


    /* =========================
       OUR DAY
       ADD TO CALENDAR
       ========================= */

    .our-day-calendar {
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
    }


    /* =========================
       OUR DAY
       VIEW MAP
       ========================= */

    .our-day-map {
      top: 92%;
      left: 50%;
      transform: translate(-50%, -50%);
    }


    /* =========================
       THE DETAILS SECTION
       IMAGE + BUTTONS
       ========================= */

    .details-section {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .details-section > img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       DETAILS BUTTONS
       ========================= */

    .details-button {

      z-index: 999;
      width: 120px;
      padding: 8px 6px;
      border: 1px solid #a98270;
      border-radius: 25px;
      background: rgba(255,255,255,0.90);

      text-decoration: none;
      text-align: center;
      font-size: 9px;
      letter-spacing: 1px;
      line-height: 1.2;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
      cursor: pointer;
      touch-action: manipulation;

    }

    .details-button:hover {

    }


    /* =========================

       THREE MAIN BUTTONS

      left: 25%;
      transform: translate(-50%, -50%);
    }

    .details-dress {
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .details-accommodations {

      left: 75%;

    /* =========================
       DETAILS

    /* =========================
       EVENT SCHEDULE

    /* =========================

    .accommodations-page {

    .hotel-button {

    /* =========================

    /* =========================

    .back-button:active {

    /* =========================

    /* =========================

      }

      .tally-card iframe {
        height: 550px;
        border-radius: 10px;
      }

    }

  </style>

</head>

  <script>


    /* =========================
       COUNTDOWN
       ========================= */

    const weddingDate =
      new Date("2026-11-28T00:00:00-06:00").getTime();


    function updateCountdown() {

      const now = Date.now();

      const difference =
        weddingDate - now;


      if (difference <= 0) {

        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";
        document.getElementById("minutes").textContent = "0";
        document.getElementById("seconds").textContent = "0";

        return;
      }


      const days =
        Math.floor(
          difference /
          (1000 * 60 * 60 * 24)
        );


      const hours =
        Math.floor(
          (difference %
            (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );


      const minutes =
        Math.floor(
          (difference %
            (1000 * 60 * 60)) /
          (1000 * 60)
        );


      const seconds =
        Math.floor(
          (difference %
            (1000 * 60)) /
          1000
        );


      document.getElementById("days").textContent =
        days;

      document.getElementById("hours").textContent =
        hours;

      document.getElementById("minutes").textContent =
        minutes;

      document.getElementById("seconds").textContent =
        seconds;

    }


    updateCountdown();

    setInterval(
      updateCountdown,
      1000
    );


    /* =========================
       SPECIAL PAGES
       ========================= */

    const mainInvitation =
      document.getElementById(
        "mainInvitation"
      );


    const specialPages =
      document.querySelectorAll(
        ".special-page"
      );


    function showMainInvitation() {

      mainInvitation.style.display =
        "block";


      specialPages.forEach(
        function(page) {

          page.classList.remove(
            "active"
          );

        }
      );

    }


    function showSpecialPage(pageId) {

      mainInvitation.style.display =
        "none";


      specialPages.forEach(
        function(page) {

          page.classList.remove(
            "active"
          );

        }
      );


      const selectedPage =
        document.getElementById(
          pageId
        );


      if (selectedPage) {

        selectedPage.classList.add(
          "active"
        );


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }

    }


    /* =========================
       OPEN SPECIAL PAGE
       ========================= */

    document
      .querySelectorAll(".special-link")
      .forEach(
        function(link) {

          link.addEventListener(
            "click",
            function(event) {

              event.preventDefault();


              const pageId =
                this.getAttribute(
                  "data-page"
                );


              history.pushState(
                null,
                "",
                "#" + pageId
              );


              showSpecialPage(
                pageId
              );

            }
          );

        }
      );


    /* =========================
       BACK TO THE DETAILS
       ========================= */

    document
      .querySelectorAll(".back-to-details")
      .forEach(
        function(link) {

          link.addEventListener(
            "click",
            function(event) {

              event.preventDefault();


              mainInvitation.style.display =
                "block";


              specialPages.forEach(
                function(page) {

                  page.classList.remove(
                    "active"
                  );

                }
              );


              history.pushState(
                null,
                "",
                "#details-section"
              );


              setTimeout(
                function() {

                  const details =
                    document.getElementById(
                      "details-section"
                    );


                  if (details) {

                    details.scrollIntoView({
                      behavior: "smooth",
                      block: "start"
                    });

                  }

                },
                50
              );

            }
          );

        }
      );


    /* =========================
       LOAD PAGE FROM HASH
       ========================= */

    function loadPageFromHash() {

      const hash =
        window.location.hash
          .replace("#", "");


      if (
        hash === "event-schedule" ||
        hash === "dress-code" ||
        hash === "accommodations"
      ) {

        showSpecialPage(
          hash
        );

      } else if (
        hash === "details-section"
      ) {

        mainInvitation.style.display =
          "block";


        specialPages.forEach(
          function(page) {

            page.classList.remove(
              "active"
            );

          }
        );


        setTimeout(
          function() {

            const details =
              document.getElementById(
                "details-section"
              );


            if (details) {

              details.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

            }

          },
          50
        );

      } else {

        showMainInvitation();

      }

    }


    window.addEventListener(
      "popstate",
      loadPageFromHash
    );


    window.addEventListener(
      "hashchange",
      loadPageFromHash
    );


    loadPageFromHash();


    /* =========================
       MUSIC PLAYER
       ========================= */

    const music =
      document.getElementById(
        "weddingMusic"
      );


    const musicButton =
      document.getElementById(
        "musicButton"
      );


    let musicPlaying = false;


    function updateMusicButton() {

      if (musicPlaying) {

        musicButton.textContent =
          "⏸";


        musicButton.setAttribute(
          "aria-label",
          "Pause music"
        );

      } else {

        musicButton.textContent =
          "🎵";


        musicButton.setAttribute(
          "aria-label",
          "Play music"
        );

      }

    }


    function startMusic() {

      music.play()

        .then(
          function() {

            musicPlaying = true;

            updateMusicButton();

          }
        )

        .catch(
          function() {

            musicPlaying = false;

            updateMusicButton();

          }
        );

    }


    musicButton.addEventListener(
      "click",
      function() {

        if (music.paused) {

          music.play()

            .then(
              function() {

                musicPlaying = true;

                updateMusicButton();

              }
            );

        } else {

          music.pause();

          musicPlaying = false;

          updateMusicButton();

        }

      }
    );


    window.addEventListener(
      "load",
      function() {

        startMusic();

      }
    );


    document.addEventListener(
      "click",
      function startAfterInteraction() {

        if (music.paused) {

          music.play()

            .then(
              function() {

                musicPlaying = true;

                updateMusicButton();

              }
            )

            .catch(
              function() {}
            );

        }


        document.removeEventListener(
          "click",
          startAfterInteraction
        );

      },
      { once: true }
    );


    updateMusicButton();


  </script>

</body>
</html>
