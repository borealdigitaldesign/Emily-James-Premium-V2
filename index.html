<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emily & James | Wedding Invitation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f3ef;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    .invitation {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      position: relative;
    }

    .page {
      width: 100%;
      display: block;
      position: relative;
    }

    .page img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       MUSIC BUTTON
       ========================= */

    #musicButton {
      position: fixed;
      right: 18px;
      bottom: 22px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(126, 85, 73, 0.35);
      background: rgba(255, 250, 247, 0.92);
      color: #805b55;
      font-size: 21px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    #musicButton:active {
      transform: scale(0.95);
    }

    /* =========================
       COUNTDOWN
       ========================= */

    .countdown-container {
      background: #f7f3ef;
      padding: 28px 18px 32px;
      text-align: center;
    }

    .countdown-title {
      margin: 0 0 18px;
      color: #805b55;
      font-size: 20px;
      letter-spacing: 2px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .countdown-box {
      min-width: 65px;
      padding: 10px 7px;
      background: rgba(255,255,255,0.75);
      border: 1px solid #c7a28c;
      border-radius: 8px;
    }

    .countdown-number {
      display: block;
      font-size: 25px;
      color: #805b55;
      font-weight: bold;
    }

    .countdown-label {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      letter-spacing: 1px;
      color: #6f625d;
      text-transform: uppercase;
    }

    /* =========================
       GENERAL BUTTONS
       ========================= */

    .actions {
      padding: 25px 18px 35px;
      background: #f7f3ef;
      text-align: center;
    }

    .action-button {
      display: block;
      width: 60%;
      max-width: 180px;
      margin: 10px auto;
      padding: 8px 12px;
      border: 1px solid #a98270;
      border-radius: 30px;
      background: rgba(255,255,255,0.8);
      color: #805b55;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .action-button:hover {
      background: #fff;
      transform: translateY(-1px);
    }


    /* =========================
       SPECIAL PAGES
       ========================= */

    .special-page {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #f7f3ef;
      text-align: center;
      padding-bottom: 35px;
    }

    .special-page.active {
      display: block;
    }

    .special-page > img {
      width: 100%;
      max-width: 700px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    

    /* =========================
   HOTEL BUTTONS
   ========================= */

.hotel-button {
  width: 85px;
  max-width: 100px;
  margin: 10px auto;
  padding: 8px 10px;
  font-size: 10px;
}

    /* =========================
       ACCOMMODATIONS
       ========================= */

    .accommodations-page {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .accommodations-page > img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* =========================
       HOTEL BUTTONS
       EACH ONE CAN BE MOVED
       INDEPENDENTLY
       ========================= */

    .hotel-button {
      position: absolute;
      width: 150px;
      padding: 8px 10px;
      border: 1px solid #a98270;
      border-radius: 25px;
      background: rgba(255,255,255,0.90);
      color: #805b55;
      text-decoration: none;
      text-align: center;
      font-size: 8px;
      letter-spacing: 1px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
      z-index: 10;
    }

    /* =========================
       COURTYARD
       ========================= */

    .hotel-courtyard {

      /*
        MOVE UP / DOWN:
        change TOP

        MOVE LEFT / RIGHT:
        change LEFT
      */

      top: 31.5%;
      left: 65%;
      transform: translate(-50%, -50%);
    }

    /* =========================
       HILTON
       ========================= */

    .hotel-hilton {
      top: 48.3%;
      left: 65%;
      transform: translate(-50%, -50%);
    }

    /* =========================
       FOUR SEASONS
       ========================= */

    .hotel-four-seasons {
      top: 65%;
      left: 65%;
      transform: translate(-50%, -50%);
    }

    /* =========================
       BACK TO INVITATION
       ========================= */

    .back-button {
      display: block;
      width: 80%;
      max-width: 260px;
      margin: 25px auto 10px;
      padding: 10px 14px;
      border: 1px solid #a98270;
      border-radius: 30px;
      background: rgba(255,255,255,0.85);
      color: #805b55;
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-align: center;
    }
    .back-button:active {
      transform: scale(0.98);
    }

    /* =========================
   BACK TO INVITATION
   ON ACCOMMODATIONS IMAGE
   ========================= */

.accommodations-back {
  position: absolute;
  width: 165px;
  max-width: none;
  padding: 9px 10px;
  margin: 0;
  font-size: 10px;
  letter-spacing: 1.2px;
  top: 76.3%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20;
}

    /* =========================
       TALLY RSVP
       ========================= */

    .tally-section {
      background: #f7f3ef;
      padding: 25px 15px 40px;
      text-align: center;
    }

    .tally-card {
      width: 92%;
      max-width: 426px;
      margin: 0 auto;
      padding: 6px;
      background: rgba(255,255,255,0.82);
      border: 1px solid #c7a28c;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(126, 85, 73, 0.10);
      overflow: hidden;
    }

    .tally-card iframe {
      width: 92%;
      height: 528px;
      border: none;
      display: block;
      border-radius: 12px;
      background: transparent;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .countdown-number {
        font-size: 21px;
      }

      .countdown-box {
        min-width: 58px;
      }

      #musicButton {
        width: 48px;
        height: 48px;
        right: 14px;
        bottom: 16px;
      }

      .hotel-button {
        width: 120px;
        font-size: 8px;
        padding: 7px 8px;
      }

      .tally-section {
        padding-left: 10px;
        padding-right: 10px;
      }

      .tally-card {
        width: 90%;
        padding: 6px;
        border-radius: 14px;
      }

      .tally-card iframe {
        height: 590px;
        border-radius: 10px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       MAIN INVITATION
       ========================= -->

  <main id="mainInvitation">

    <div class="invitation">


      <!-- COVER -->

      <div class="page">
        <img
          src="portada.png"
          alt="Emily & James Wedding Invitation">
      </div>


      <!-- OUR STORY -->

      <div class="page">
        <img
          src="our-story.png"
          alt="Our Story">
      </div>


      <!-- OUR DAY -->

      <div class="page">
        <img
          src="our-day.png"
          alt="Our Day">
      </div>


      <!-- COUNTDOWN -->

      <section class="countdown-container">

        <h2 class="countdown-title">
          WE CAN'T WAIT TO CELEBRATE WITH YOU
        </h2>

        <div class="countdown">

          <div class="countdown-box">
            <span
              class="countdown-number"
              id="days">0</span>

            <span class="countdown-label">
              Days
            </span>
          </div>


          <div class="countdown-box">
            <span
              class="countdown-number"
              id="hours">0</span>

            <span class="countdown-label">
              Hours
            </span>
          </div>
          <div class="countdown-box">
            <span
              class="countdown-number"
              id="minutes">0</span>

            <span class="countdown-label">
              Minutes
            </span>
          </div>
          <div class="countdown-box">
            <span
              class="countdown-number"
              id="seconds">0</span>
            <span class="countdown-label">
              Seconds
            </span>
          </div>
        </div>

      </section>


      <!-- EVENT SCHEDULE -->
      <section class="actions">
        <a
          href="#event-schedule"
          class="action-button special-link"
          data-page="event-schedule">
          VIEW EVENT SCHEDULE
        </a>
      </section>


      <!-- DETAILS -->

      <div
        class="page"
        id="details-section">
        <img
          src="the-details.png"
          alt="The Details">
      </div>


      <!-- DRESS CODE -->

      <section class="actions">
        <a
          href="#dress-code"
          class="action-button special-link"
          data-page="dress-code">
          VIEW DRESS CODE
        </a>

      </section>


      <!-- MAIN ACTIONS -->

      <section class="actions">

        <a
          class="action-button"
          href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Emily%20%26%20James%20Wedding&dates=20261128/20261129&location=The%20Garden%20Valley%2C%20Nashville%2C%20TN"
          target="_blank"
          rel="noopener">
          ADD TO CALENDAR
        </a>

        <a
          class="action-button"
          href="https://maps.app.goo.gl/KEUUGJGszw54wpxC9?g_st=ic"
          target="_blank"
          rel="noopener">
          VIEW MAP
        </a>

        <a
          class="action-button"
          href="https://www.amazon.com/registries/gl/create?registryType=custom&ref_=ggr_emp_custom"
          target="_blank"
          rel="noopener">
          VIEW REGISTRY
        </a>

        <a
          class="action-button"
          href="mailto:mrs.lacunza@gmail.com">
          RSVP BY EMAIL
        </a>

        <a
          class="action-button"
          href="sms:+19316192063">
          TEXT TO RSVP
        </a>

      </section>

      <!-- ACCOMMODATIONS -->

      <section class="actions">

        <a
          href="#accommodations"
          class="action-button special-link"
          data-page="accommodations">
          VIEW ACCOMMODATIONS
        </a>

      </section>


      <!-- GALLERY -->

      <div class="page">

        <img
          src="gallery.png"
          alt="Gallery">

      </div>


      <!-- ONLINE RSVP IMAGE -->

      <div class="page">

        <img
          src="online-rsvp.png"
          alt="Online RSVP">

      </div>


      <!-- TALLY -->

      <section class="tally-section">

        <div class="tally-card">

          <iframe
            src="https://tally.so/embed/Eko7lr?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
            loading="lazy"
            title="Emily & James Online RSVP">
          </iframe>

        </div>

      </section>


      <!-- END -->

      <div class="page">

        <img
          src="end.png"
          alt="Thank You">

      </div>

    </div>

  </main>


  <!-- =========================
       EVENT SCHEDULE PAGE
       ========================= -->

  <section
    id="event-schedule"
    class="special-page">

    <img
      src="event-schedule.png"
      alt="Event Schedule">

    <a
      href="#details-section"
      class="back-button back-to-details">
      BACK TO INVITATION
    </a>

  </section>


  <!-- =========================
       DRESS CODE PAGE
       ========================= -->

  <section
    id="dress-code"
    class="special-page">

    <img
      src="dress-code.png"
      alt="Dress Code">
    <a
      href="#details-section"
      class="back-button back-to-details">
      BACK TO INVITATION
    </a>
  </section>

  <!-- =========================
       ACCOMMODATIONS PAGE
       ========================= -->

  <section
    id="accommodations"
    class="special-page">
    <div class="accommodations-page">
      <img
        src="accommodations.png"
        alt="Accommodations">

      <!-- COURTYARD -->
      <a
        class="hotel-button hotel-courtyard"
        href="https://maps.app.goo.gl/GvNDmyotaz6X3fBw8?g_st=ic"
        target="_blank"
        rel="noopener">
        VIEW HOTEL
      </a>

      <!-- HILTON -->
      <a
        class="hotel-button hotel-hilton"
        href="https://maps.app.goo.gl/dV8X18uiQC9rwmor6?g_st=ic"
        target="_blank"
        rel="noopener">
        VIEW HOTEL
      </a>

      <!-- FOUR SEASONS -->
      <a
        class="hotel-button hotel-four-seasons"
        href="https://maps.app.goo.gl/bZVu7zGhxoazHQs76?g_st=ic"
        target="_blank"
        rel="noopener">
        VIEW HOTEL
      </a>

    <!-- BACK TO INVITATION -->
    <a
      href="#details-section"
      class="back-button accommodations-back back-to-details">
      BACK TO INVITATION
    </a>
  </section>


  <!-- =========================
       MUSIC
       ========================= -->

  <audio
    id="weddingMusic"
    loop
    preload="auto">

    <source
      src="musica.mp3"
      type="audio/mpeg">

  </audio>

  <button
    id="musicButton"
    type="button"
    aria-label="Play music">
    🎵
  </button>

  <script>

    /* =========================
       COUNTDOWN
       ========================= */

    const weddingDate =
      new Date("2026-11-28T00:00:00-06:00").getTime();

    function updateCountdown() {

      const now = Date.now();

      const difference =
        weddingDate - now;

      if (difference <= 0) {

        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";
        document.getElementById("minutes").textContent = "0";
        document.getElementById("seconds").textContent = "0";

        return;
      }

      const days =
        Math.floor(
          difference /
          (1000 * 60 * 60 * 24)
        );

      const hours =
        Math.floor(
          (difference %
            (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );

      const minutes =
        Math.floor(
          (difference %
            (1000 * 60 * 60)) /
          (1000 * 60)
        );

      const seconds =
        Math.floor(
          (difference %
            (1000 * 60)) /
          1000
        );

      document.getElementById("days").textContent =
        days;

      document.getElementById("hours").textContent =
        hours;

      document.getElementById("minutes").textContent =
        minutes;

      document.getElementById("seconds").textContent =
        seconds;

    }

    updateCountdown();

    setInterval(
      updateCountdown,
      1000
    );

    /* =========================
       SPECIAL PAGES
       ========================= */

    const mainInvitation =
      document.getElementById(
        "mainInvitation"
      );

    const specialPages =
      document.querySelectorAll(
        ".special-page"
      );

    function showMainInvitation() {

      mainInvitation.style.display =
        "block";

      specialPages.forEach(
        function(page) {

          page.classList.remove(
            "active"
          );

        }
      );

    }

    function showSpecialPage(pageId) {

      mainInvitation.style.display =
        "none";

      specialPages.forEach(
        function(page) {

          page.classList.remove(
            "active"
          );

        }
      );


      const selectedPage =
        document.getElementById(
          pageId
        );

      if (selectedPage) {

        selectedPage.classList.add(
          "active"
        );

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }

    }


    /* =========================
       OPEN SPECIAL PAGE
       ========================= */

    document
      .querySelectorAll(".special-link")
      .forEach(
        function(link) {

          link.addEventListener(
            "click",
            function(event) {

              event.preventDefault();

              const pageId =
                this.getAttribute(
                  "data-page"
                );

              history.pushState(
                null,
                "",
                "#" + pageId
              );


              showSpecialPage(
                pageId
              );

            }
          );

        }
      );


    /* =========================
       BACK TO THE DETAILS
       ========================= */

    document
      .querySelectorAll(".back-to-details")
      .forEach(
        function(link) {

          link.addEventListener(
            "click",
            function(event) {

              event.preventDefault();


              mainInvitation.style.display =
                "block";


              specialPages.forEach(
                function(page) {

                  page.classList.remove(
                    "active"
                  );

                }
              );


              history.pushState(
                null,
                "",
                "#details-section"
              );


              setTimeout(
                function() {

                  const details =
                    document.getElementById(
                      "details-section"
                    );


                  if (details) {

                    details.scrollIntoView({
                      behavior: "smooth",
                      block: "start"
                    });

                  }

                },
                50
              );

            }
          );

        }
      );


    /* =========================
       LOAD PAGE FROM HASH
       ========================= */

    function loadPageFromHash() {

      const hash =
        window.location.hash
          .replace("#", "");


      if (
        hash === "event-schedule" ||
        hash === "dress-code" ||
        hash === "accommodations"
      ) {

        showSpecialPage(
          hash
        );

      } else if (
        hash === "details-section"
      ) {

        mainInvitation.style.display =
          "block";


        specialPages.forEach(
          function(page) {

            page.classList.remove(
              "active"
            );

          }
        );


        setTimeout(
          function() {

            const details =
              document.getElementById(
                "details-section"
              );


            if (details) {

              details.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

            }

          },
          50
        );

      } else {

        showMainInvitation();

      }

    }


    window.addEventListener(
      "popstate",
      loadPageFromHash
    );


    window.addEventListener(
      "hashchange",
      loadPageFromHash
    );


    loadPageFromHash();


    /* =========================
       MUSIC PLAYER
       ========================= */

    const music =
      document.getElementById(
        "weddingMusic"
      );


    const musicButton =
      document.getElementById(
        "musicButton"
      );


    let musicPlaying = false;


    function updateMusicButton() {

      if (musicPlaying) {

        musicButton.textContent =
          "⏸";


        musicButton.setAttribute(
          "aria-label",
          "Pause music"
        );

      } else {

        musicButton.textContent =
          "🎵";


        musicButton.setAttribute(
          "aria-label",
          "Play music"
        );

      }

    }


    function startMusic() {

      music.play()

        .then(
          function() {

            musicPlaying = true;

            updateMusicButton();

          }
        )

        .catch(
          function() {

            musicPlaying = false;

            updateMusicButton();

          }
        );

    }


    musicButton.addEventListener(
      "click",
      function() {

        if (music.paused) {

          music.play()

            .then(
              function() {

                musicPlaying = true;

                updateMusicButton();

              }
            );

        } else {

          music.pause();

          musicPlaying = false;

          updateMusicButton();

        }

      }
    );


    window.addEventListener(
      "load",
      function() {

        startMusic();

      }
    );


    document.addEventListener(
      "click",
      function startAfterInteraction() {

        if (music.paused) {

          music.play()

            .then(
              function() {

                musicPlaying = true;

                updateMusicButton();

              }
            )

            .catch(
              function() {}
            );

        }


        document.removeEventListener(
          "click",
          startAfterInteraction
        );

      },
      { once: true }
    );


    updateMusicButton();


  </script>

</body>
</html>
